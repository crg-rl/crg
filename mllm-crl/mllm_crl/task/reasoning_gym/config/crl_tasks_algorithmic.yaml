reasoning_gym:
  dataset_size: 20000
  developer_prompt: DeepSeekZero
  datasets:
    base_conversion:
      weight: 1
    binary_alternation:
      weight: 1
      config:
        p_solvable: 0.9
    binary_matrix:
      weight: 1
      config:
        min_n: 2
        max_n: 6
    caesar_cipher:
      weight: 1
      config:
        max_words: 10
    cryptarithm:
      weight: 1
    isomorphic_strings:
      weight: 1
      config:
        max_string_length: 8
    jugs:
      weight: 1
      config:
        difficulty: 6
    rotate_matrix:
      weight: 1
      config:
        min_n: 2
        max_n: 6
    string_manipulation:
      weight: 1
      config:
        max_string_length: 15
        max_num_rules: 6
    ab:
      weight: 1

curriculum:
  enabled: False

crl:
  enabled: True
  # Match `trainer.save_freq` and `trainer.test_freq` to this boundary.
  # The launcher sets steps_per_task.
  valid_ratio: 0.1
  # Validation runs at each task boundary with 256 examples.
  val_dataset_size: 256
  train_seed: 1
  val_seed: 2
  task_seed_stride: 1000
